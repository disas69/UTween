<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="curve1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#198BFF" />
      <stop offset="60%" stop-color="#14C7EB" />
      <stop offset="100%" stop-color="#1FD180" />
    </linearGradient>

    <linearGradient id="curve2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1FD180" />
      <stop offset="40%" stop-color="#9447FA" />
      <stop offset="100%" stop-color="#F03894" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#logoBg)" stroke="#1e293b" stroke-width="3" />
  <circle cx="256" cy="240" r="160" fill="#198BFF" fill-opacity="0.08" filter="url(#glow)" />

  <path d="M 150 140 L 150 260 C 150 340 210 375 256 375 C 302 375 362 340 362 260 L 362 140"
        fill="none" stroke="url(#curve1)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />

  <path d="M 150 260 C 180 340 240 375 280 340 C 320 305 330 200 370 180 C 400 165 420 180 435 205"
        fill="none" stroke="url(#curve2)" stroke-width="18" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />

  <circle cx="150" cy="140" r="10" fill="#198BFF" />
  <circle cx="256" cy="375" r="8" fill="#1FD180" />
  <circle cx="362" cy="140" r="10" fill="#F03894" />
  <circle cx="435" cy="205" r="7" fill="#FFAE1F" />
</svg>